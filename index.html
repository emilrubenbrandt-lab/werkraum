<style>
  /* Gate erbt denselben Token-Satz wie der STYLE-Block in gen_werkraum_bundle.py
     (separates File, gleiches System). Das Gate darf zentriert bleiben. */
  :root {
    --fs-code: 13px;
    --fs-heading: 22px;
    --sp-1: 4px;
    --sp-2: 8px;
    --sp-3: 12px;
    --sp-4: 16px;
    --sp-5: 24px;
    --sp-6: 32px;
    --c-ink: #000;
    --c-paper: #fff;
    --c-mute: #6b6b6b;
    --pad-x: 5vw;
    --ls: 0.02em;
    --lh-tight: 1.25;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Courier New', monospace; background: var(--c-paper); color: var(--c-ink);
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  }
  #gate { text-align: center; padding: var(--pad-x); }
  #gate h1 { font-size: 16px; font-weight: normal; letter-spacing: var(--ls); line-height: var(--lh-tight); margin-bottom: var(--sp-6); }
  #pw {
    font-family: 'Courier New', monospace; font-size: 18px; text-align: center;
    letter-spacing: 0.4em; width: 140px; padding: var(--sp-2) var(--sp-1); border: none;
    background: transparent; outline: none; color: var(--c-ink);
  }
  #go {
    display: block; margin: var(--sp-5) auto 0; font-family: 'Courier New', monospace;
    font-size: var(--fs-heading); line-height: 1; padding: var(--sp-1) var(--sp-3); cursor: pointer;
    border: none; background: transparent; color: var(--c-ink);
    transition: opacity 0.15s;
  }
  #go:hover { opacity: 0.45; }
  #msg { font-size: var(--fs-code); color: var(--c-mute); margin-top: var(--sp-4); height: 16px; letter-spacing: var(--ls); }
  @keyframes shake { 10%, 90% { transform: translateX(-2px); } 30%, 70% { transform: translateX(3px); } 50% { transform: translateX(-3px); } }
  .shake { animation: shake 0.32s ease-in-out; }
  @media (prefers-reduced-motion: reduce) { .shake { animation: none; } }
</style>
</head>

</div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const ab2b64 = buf => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
const input = document.getElementById('pw');
const msg = document.getElementById('msg');

async function unlock(pw) {
  msg.textContent = 'entschlüssele…';
  try {
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    // extractable: true — der Schlüssel wird ins entschlüsselte Dokument exportiert,
    // damit es die Depot-Bilder ohne erneutes PBKDF2 nachladen kann.
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(DATA.salt), iterations: DATA.iter, hash: 'SHA-256' },
      baseKey, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(DATA.iv) }, key, b64(DATA.ct));
    let html = new TextDecoder().decode(plain);
    const rawKey = ab2b64(await crypto.subtle.exportKey('raw', key));
    const cfg = 'window.__WK=' + JSON.stringify({ key: rawKey, depot: DATA.depot }) + ';';
    html = html.replace('window.__WK=null;/*WK_CONFIG*/', cfg);
    document.open(); document.write(html); document.close();
  } catch (e) {
    msg.textContent = '';
    input.value = '';
    input.classList.remove('shake'); void input.offsetWidth; input.classList.add('shake');
    input.focus();
  }
}

document.getElementById('go').addEventListener('click', () => { if (input.value) unlock(input.value); });
input.addEventListener('keydown', e => { if (e.key === 'Enter' && input.value) unlock(input.value); });
</script>
